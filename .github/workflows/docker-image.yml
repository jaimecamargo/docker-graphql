name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Git Semantic Version
      uses: PaulHatch/semantic-version@v4.0.3
      with:
        # A string which, if present in a git commit, indicates that a change represents a
        # major (breaking) change, supports regular expressions wrapped with '/'
        major_pattern: "major:"
        # Same as above except indicating a minor change, supports regular expressions wrapped with '/'
        minor_pattern: "feat:"
        # A string to determine the format of the version output
        format: "${major}.${minor}.${patch}-prerelease${increment}"
      id: versioning

    - name: Docker login
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      run: |
        echo "Starting login..."
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
        echo "Finishing login..."

    - name: Build Docker Image
      env:
        VERSION: ${{ steps.versioning.outputs.version }}
      run: |
        echo "Building the docker image"
        docker build -t jaimecamargo/docker-graphql:$VERSION .
        docker build -t jaimecamargo/docker-graphql:latest .

    - name: Push Docker Image
      env:
        VERSION: ${{ steps.versioning.outputs.version }}
      run: |
        echo "Pushing the docker image"
        docker push jaimecamargo/docker-graphql:$VERSION
        docker push jaimecamargo/docker-graphql:latest

    # - name: Build the Docker image
    #   run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
